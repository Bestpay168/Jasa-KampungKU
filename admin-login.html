<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ff6b00"
    >

    <title>Login Admin — JASA KAMPUNG</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    145deg,
                    #fff7f1 0%,
                    #ffffff 50%,
                    #f8f9fb 100%
                );

            color: #17202a;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* =====================================================
           LOGIN CONTAINER
        ===================================================== */

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 14px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff6b00;
            color: #ffffff;

            font-size: 30px;
            font-weight: 900;

            box-shadow:
                0 12px 30px rgba(255, 107, 0, 0.22);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 6px;

            color: #68727d;

            font-size: 13px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .login-card {
            background: #ffffff;

            border: 1px solid #e7eaee;

            border-radius: 24px;

            padding: 28px 24px;

            box-shadow:
                0 20px 50px rgba(23, 32, 42, 0.08);
        }

        .login-title {
            margin-bottom: 22px;
        }

        .login-title h2 {
            font-size: 20px;
            font-weight: 800;
        }

        .login-title p {
            margin-top: 5px;

            color: #68727d;

            font-size: 12px;
            line-height: 1.5;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;

            height: 50px;

            padding:
                0 46px 0 15px;

            border:
                1.5px solid #e7eaee;

            border-radius: 13px;

            outline: none;

            background: #ffffff;

            color: #17202a;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #ff6b00;

            box-shadow:
                0 0 0 4px rgba(255, 107, 0, 0.08);
        }

        .input-icon {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #929aa3;

            font-size: 17px;

            pointer-events: none;
        }

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            border: none;

            background: transparent;

            cursor: pointer;

            color: #68727d;

            font-size: 16px;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .login-button {
            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #ff6b00;

            color: #ffffff;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

            box-shadow:
                0 10px 24px rgba(255, 107, 0, 0.22);
        }

        .login-button:hover {
            background: #e85d00;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: none;

            margin-bottom: 16px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #b91c1c;
        }

        .message.success {
            display: block;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            color: #15803d;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {
            text-align: center;

            margin-top: 18px;

            color: #929aa3;

            font-size: 11px;

            line-height: 1.5;
        }

        .back-home {
            display: inline-block;

            margin-top: 8px;

            color: #ff6b00;

            text-decoration: none;

            font-weight: 700;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .spinner {
            display: inline-block;

            width: 17px;
            height: 17px;

            border:
                2px solid rgba(255,255,255,0.45);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 24px 20px;

                border-radius: 20px;
            }

            .brand h1 {
                font-size: 22px;
            }

            .brand-logo {
                width: 62px;
                height: 62px;

                border-radius: 18px;

                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="brand">

            <div class="brand-logo">
                JK
            </div>

            <h1>JASA KAMPUNG</h1>

            <p>
                Panel Administrator
            </p>

        </div>


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">

            <div class="login-title">

                <h2>
                    Login Admin
                </h2>

                <p>
                    Masuk untuk mengelola pesanan,
                    pembayaran, layanan, dan pelanggan.
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="message"
                role="alert"
            ></div>


            <!-- FORM -->

            <form id="adminLoginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Email Admin
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            placeholder="admin@email.com"
                            autocomplete="email"
                            required
                        >

                        <span class="input-icon">
                            ✉
                        </span>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Tampilkan password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Masuk ke Dashboard
                </button>

            </form>

        </section>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="login-footer">

            <div>
                Akses khusus administrator
            </div>

            <a
                href="index.html"
                class="back-home"
            >
                ← Kembali ke JASA KAMPUNG
            </a>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- =====================================================
         ADMIN LOGIN
    ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const supabase =
                    window.JasaKampungSupabase;

                const form =
                    document.getElementById(
                        "adminLoginForm"
                    );

                const emailInput =
                    document.getElementById(
                        "adminEmail"
                    );

                const passwordInput =
                    document.getElementById(
                        "adminPassword"
                    );

                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );

                const message =
                    document.getElementById(
                        "loginMessage"
                    );

                const togglePassword =
                    document.getElementById(
                        "togglePassword"
                    );


                /* =============================================
                   CEK SUPABASE
                ============================================= */

                if (!supabase) {

                    showMessage(
                        "error",
                        "Supabase belum terhubung. Periksa file supabase.js."
                    );

                    return;
                }


                /* =============================================
                   CEK SESSION
                ============================================= */

                const {
                    data: {
                        session
                    }
                } = await supabase.auth.getSession();


                if (session) {

                    /*
                      Jangan langsung menganggap semua
                      user adalah admin.

                      Kita cek tabel admin_users.
                    */

                    const isAdmin =
                        await checkAdmin(
                            session.user.id
                        );

                    if (isAdmin) {

                        window.location.href =
                            "admin.html";

                        return;
                    }

                    /*
                      User login tetapi bukan admin.
                    */

                    await supabase.auth.signOut();
                }


                /* =============================================
                   TOGGLE PASSWORD
                ============================================= */

                togglePassword.addEventListener(
                    "click",
                    function () {

                        const isPassword =
                            passwordInput.type ===
                            "password";

                        passwordInput.type =
                            isPassword
                                ? "text"
                                : "password";

                        togglePassword.textContent =
                            isPassword
                                ? "🙈"
                                : "👁";
                    }
                );


                /* =============================================
                   LOGIN
                ============================================= */

                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const email =
                            emailInput.value.trim();

                        const password =
                            passwordInput.value;


                        if (!email || !password) {

                            showMessage(
                                "error",
                                "Email dan password wajib diisi."
                            );

                            return;
                        }


                        setLoading(true);


                        const {
                            data,
                            error
                        } = await supabase.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                        if (error) {

                            console.error(
                                "Login error:",
                                error
                            );

                            showMessage(
                                "error",
                                getLoginErrorMessage(
                                    error
                                )
                            );

                            setLoading(false);

                            return;
                        }


                        /* =====================================
                           CEK APAKAH USER ADMIN
                        ====================================== */

                        const isAdmin =
                            await checkAdmin(
                                data.user.id
                            );


                        if (!isAdmin) {

                            await supabase.auth.signOut();

                            showMessage(
                                "error",
                                "Akun berhasil login, tetapi tidak memiliki akses administrator."
                            );

                            setLoading(false);

                            return;
                        }


                        /* =====================================
                           BERHASIL
                        ====================================== */

                        showMessage(
                            "success",
                            "Login berhasil. Membuka dashboard..."
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "admin.html";

                            },
                            500
                        );

                    }
                );


                /* =============================================
                   CHECK ADMIN
                ============================================= */

                async function checkAdmin(
                    userId
                ) {

                    try {

                        const {
                            data,
                            error
                        } = await supabase
                            .from("admin_users")
                            .select("user_id")
                            .eq(
                                "user_id",
                                userId
                            )
                            .maybeSingle();


                        if (error) {

                            console.error(
                                "Admin check error:",
                                error
                            );

                            return false;
                        }


                        return !!data;

                    } catch (error) {

                        console.error(
                            error
                        );

                        return false;
                    }
                }


                /* =============================================
                   LOADING
                ============================================= */

                function setLoading(
                    loading
                ) {

                    loginButton.disabled =
                        loading;

                    if (loading) {

                        loginButton.innerHTML =
                            `
                            <span class="spinner"></span>
                            Memproses...
                            `;

                    } else {

                        loginButton.textContent =
                            "Masuk ke Dashboard";
                    }
                }


                /* =============================================
                   MESSAGE
                ============================================= */

                function showMessage(
                    type,
                    text
                ) {

                    message.className =
                        "message " + type;

                    message.textContent =
                        text;
                }


                /* =============================================
                   LOGIN ERROR
                ============================================= */

                function getLoginErrorMessage(
                    error
                ) {

                    const msg =
                        String(
                            error?.message || ""
                        ).toLowerCase();


                    if (
                        msg.includes(
                            "invalid login credentials"
                        )
                    ) {

                        return "Email atau password salah.";
                    }


                    if (
                        msg.includes(
                            "email not confirmed"
                        )
                    ) {

                        return "Email belum dikonfirmasi. Periksa email Anda.";
                    }


                    if (
                        msg.includes(
                            "too many requests"
                        )
                    ) {

                        return "Terlalu banyak percobaan login. Silakan coba lagi beberapa saat.";
                    }


                    return (
                        error?.message ||
                        "Login gagal. Silakan coba lagi."
                    );
                }

            }
        );

    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</body>
</html>
